<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Banking App</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-card class="balance-card">
    <ion-card-header>
      <ion-card-subtitle>Total Balance</ion-card-subtitle>
      <ion-card-title>$14,250.00</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <p>Updated 2 mins ago</p>
      <ion-button id="transferBtn" expand="block" color="primary">
        Transfer Money
      </ion-button>
    </ion-card-content>
  </ion-card>

  <ion-list>
    <ion-item button detail="true">
      <ion-icon name="card" slot="start" color="secondary"></ion-icon>
      <ion-label>
        <h2>Virtual Visa Card</h2>
        <p>**** 4821</p>
      </ion-label>
      <ion-badge color="success" slot="end">Active</ion-badge>
    </ion-item>
  </ion-list>
</ion-content>
